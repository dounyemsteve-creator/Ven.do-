<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VENDO - Selling Original Products</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0a0a;color:#fff;padding-bottom:70px}
.top-bar{background:#111;padding:6px 15px;font-size:11px;color:#aaa;display:flex;justify-content:space-between}
.header-main{background:#000;padding:10px 15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:999}
.logo{font-size:24px;font-weight:900}
.logo span:nth-child(1){color:#e53238}.logo span:nth-child(2){color:#0064d2}.logo span:nth-child(3){color:#ffc107}.logo span:nth-child(4){color:#86b817}
.logo-sub{font-size:9px;color:#aaa;font-weight:400}
.header-icons{display:flex;align-items:center;gap:12px;flex:1}
.icon-btn{position:relative;font-size:22px;cursor:pointer}
.notif-badge{position:absolute;top:-3px;right:-6px;background:#e53238;color:#fff;font-size:9px;padding:1px 5px;border-radius:10px;font-weight:800}
.search-box{flex:1;background:#1a1a1a;border-radius:20px;padding:8px 15px;display:flex;align-items:center;gap:8px}
.search-box input{background:transparent;border:none;color:#fff;width:100%;outline:none}
.cart-icon{position:relative;font-size:24px;cursor:pointer}
.cart-count{position:absolute;top:-5px;right:-8px;background:#e53238;color:#fff;font-size:9px;padding:1px 5px;border-radius:10px;font-weight:800}
.trust-bar{display:flex;justify-content:space-around;padding:12px;background:#111;font-size:11px;color:#aaa;border-bottom:1px solid #222}
.slider{position:relative;height:180px;overflow:hidden;background:#000}
.slide{position:absolute;width:100%;height:100%;opacity:0;transition:1s;background-size:cover;background-position:center}
.slide.active{opacity:1}
.dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.dot{width:8px;height:8px;background:#555;border-radius:50%}
.dot.active{background:#ffc107}
.categories{display:flex;justify-content:space-around;padding:15px 10px;background:#111}
.cat{text-align:center;font-size:10px;color:#ccc}
.cat-icon{font-size:24px;margin-bottom:4px}
.flash{background:#111;margin:10px 15px;border-radius:12px;padding:12px;border:1px solid #222}
.flash-header{display:flex;justify-content:space-between;margin-bottom:10px}
.flash-title{font-size:16px;font-weight:900;color:#ff3c00}
.timer{font-size:12px;background:#ff3c00;padding:3px 8px;border-radius:5px;font-weight:700}
.flash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.flash-item{background:#1a1a1a;border-radius:8px;padding:5px;text-align:center}
.flash-item img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}
.flash-price{color:#ff3c00;font-weight:900;font-size:14px}
.old-price{text-decoration:line-through;color:#666;font-size:10px}
.country-bar{display:flex;gap:8px;padding:12px 15px;overflow-x:auto}
.country-btn{padding:8px 16px;background:#1a1a1a;border:1px solid #333;border-radius:20px;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.country-btn.active{background:#ffc107;color:#000}
.section-title{padding:0 15px 10px 15px;font-size:18px;font-weight:900}
.container{padding:0 15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#111;border-radius:12px;overflow:hidden;border:1px solid #222;cursor:pointer}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover}
.card-body{padding:10px}
.title{font-size:13px;font-weight:600;height:34px;overflow:hidden;margin-bottom:4px}
.desc{font-size:11px;color:#aaa;height:26px;overflow:hidden;margin-bottom:6px}
.price{font-size:17px;font-weight:900;color:#ffc107;margin-bottom:4px}
.meta{font-size:10px;color:#888;margin-bottom:4px}
.shipping-free{font-size:11px;color:#00a3df;font-weight:700;margin-bottom:6px}
.btn-add{width:100%;background:#ffc107;color:#000;border:none;padding:8px;border-radius:20px;font-weight:900;font-size:12px;cursor:pointer}
.badge-new{position:absolute;top:8px;left:8px;background:#ff3c00;color:#fff;font-size:9px;padding:3px 6px;border-radius:4px;font-weight:900}
.badge-selling{position:absolute;top:8px;right:8px;background:#86b817;color:#000;font-size:9px;padding:3px 6px;border-radius:4px;font-weight:900}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0}
.nav-item{text-align:center;font-size:10px;color:#888;cursor:pointer}
.nav-item.active{color:#0064d2}
.nav-icon{font-size:22px;margin-bottom:3px}
.cart-sidebar,.notif-panel{position:fixed;top:0;width:320px;height:100%;background:#111;z-index:1000;transition:0.3s;padding:20px;border-left:1px solid #222}
.cart-sidebar{right:-350px}.cart-sidebar.active{right:0}
.notif-panel{left:-350px;border-right:1px solid #222;border-left:none}.notif-panel.active{left:0}
.cart-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;z-index:999}
.cart-overlay.active{display:block}
.cart-header,.notif-header{display:flex;justify-content:space-between;margin-bottom:20px;font-size:18px;font-weight:900}
.btn-checkout{width:100%;background:#ffc107;color:#000;border:none;padding:14px;border-radius:10px;font-weight:900;position:absolute;bottom:20px;left:20px;width:calc(100% - 40px)}
.notif-item{display:flex;gap:12px;padding:12px;background:#1a1a1a;border-radius:10px;margin-bottom:10px;cursor:pointer}
.product-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:1001;overflow-y:auto}
.product-modal.active{display:block}
.product-modal-content{background:#111;margin:0 auto;max-width:500px;min-height:100vh;position:relative;border-left:1px solid #222;border-right:1px solid #222}
.close-modal{position:absolute;top:15px;right:20px;font-size:24px;color:#fff;background:#0008;padding:5px 10px;border-radius:50%;z-index:10;cursor:pointer}
.product-detail-img{width:100%;aspect-ratio:1;object-fit:cover}
.product-detail-body{padding:15px;padding-bottom:80px}
.product-detail-title{font-size:16px;font-weight:600;margin-bottom:8px}
.product-detail-price{font-size:26px;font-weight:900;color:#ff3c00;margin-bottom:4px}
.info-box{background:#1a1a1a;border-radius:10px;padding:12px;margin-bottom:12px}
.info-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}
.delivery-date{color:#86b817;font-weight:700;font-size:12px}
.btn-group{position:fixed;bottom:0;left:0;right:0;max-width:500px;margin:0 auto;display:flex;gap:0;background:#111;border-top:1px solid #222;padding:10px}
.btn-add-cart{flex:1;background:#ffc107;color:#000;border:none;padding:14px;font-weight:900;font-size:15px}
.btn-buy-now{flex:1.5;background:#ff3c00;color:#fff;border:none;padding:14px;font-weight:900;font-size:15px}
</style>
</head>
<body>

<div class="top-bar"><span>VENDO - Selling Original Products</span><span>🇫🇷 FR</span></div>
<div class="header-main">
  <div><div class="logo"><span>V</span><span>E</span><span>N</span><span>D</span>O</div><div class="logo-sub">SELLING</div></div>
  <div class="header-icons">
    <div class="icon-btn" onclick="openNotifications()">🔔<span class="notif-badge" id="notifCount">5</span></div>
    <div class="search-box">🔍 <input placeholder="Search products"></div>
    <div class="cart-icon" onclick="toggleCart()">🛒<span class="cart-count">0</span></div>
  </div>
</div>

<div class="trust-bar"><div>✅ Authentic Products</div><div>🔒 Secure Payment</div><div>📦 Fast Shipping</div></div>

<div class="slider">
  <div class="slide active" style="background-image:url('https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=1200')"></div>
  <div class="slide" style="background-image:url('https://images.unsplash.com/photo-1555529669-e69e7aa0ba9d?w=1200')"></div>
  <div class="slide" style="background-image:url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1200')"></div>
  <div class="dots"><div class="dot active"></div><div class="dot"></div><div class="dot"></div></div>
</div>

<div class="categories">
  <div class="cat"><div class="cat-icon">📱</div>Tech</div>
  <div class="cat"><div class="cat-icon">🧴</div>Beauty</div>
  <div class="cat"><div class="cat-icon">🏠</div>Home</div>
  <div class="cat"><div class="cat-icon">👕</div>Fashion</div>
  <div class="cat"><div class="cat-icon">🎮</div>Gaming</div>
</div>

<div class="flash">
  <div class="flash-header"><div class="flash-title">⚡ FLASH DEALS</div><div class="timer" id="timer">23:59:59</div></div>
  <div class="flash-grid" id="flashGrid"></div>
</div>

<div class="country-bar">
  <button class="country-btn active" onclick="setCountry('FR', this)">🇫🇷 France</button>
  <button class="country-btn" onclick="setCountry('US', this)">🇺🇸 USA</button>
  <button class="country-btn" onclick="setCountry('CM', this)">🇨🇲 Cameroun</button>
</div>
<div class="section-title">🔥 Recommended For You</div>
<div class="container"><div class="grid" id="productsGrid"></div></div>

<div class="bottom-nav">
  <div class="nav-item active"><div class="nav-icon">🏠</div>Home</div>
  <div class="nav-item"><div class="nav-icon">🔍</div>Search</div>
  <div class="nav-item"><div class="nav-icon">📥</div>Inbox</div>
  <div class="nav-item"><div class="nav-icon">👤</div>Account</div>
</div>

<div id="cartSidebar" class="cart-sidebar">
  <div class="cart-header"><h3>Your Cart</h3><span onclick="toggleCart()">✕</span></div>
  <div id="cartItems"></div>
  <button class="btn-checkout">Checkout</button>
</div>

<div id="notifPanel" class="notif-panel">
  <div class="notif-header"><h3>🆕 New Arrivals</h3><span onclick="closeNotifications()">✕</span></div>
  <div id="notifList"></div>
</div>

<div id="cartOverlay" class="cart-overlay" onclick="toggleCart(); closeNotifications()"></div>

<div id="productModal" class="product-modal">
  <div class="product-modal-content">
    <span class="close-modal" onclick="closeProduct()">✕</span>
    <div id="productDetail"></div>
  </div>
</div>

<div id="checkoutModal" class="product-modal">
  <div class="product-modal-content" style="max-width:400px; min-height:auto; margin-top:50px">
    <span class="close-modal" onclick="closeCheckout()">✕</span>
    <div style="padding:20px">
      <h2 style="margin-bottom:15px">Shipping Address</h2>
      <input id="shipName" placeholder="Full Name" style="width:100%; padding:12px; margin-bottom:10px; background:#1a1a1a; border:1px solid #333; color:#fff; border-radius:8px">
      <input id="shipPhone" placeholder="Phone Number" style="width:100%; padding:12px; margin-bottom:10px; background:#1a1a1a; border:1px solid #333; color:#fff; border-radius:8px">
      <textarea id="shipAddress" placeholder="Full Address" rows="3" style="width:100%; padding:12px; margin-bottom:15px; background:#1a1a1a; border:1px solid #333; color:#fff; border-radius:8px"></textarea>
      <div id="checkoutSummary" style="background:#1a1a1a; padding:12px; border-radius:8px; margin-bottom:15px"></div>
      <button onclick="payWithBinance()" style="width:100%; background:#F3BA2F; color:#000; border:none; padding:14px; border-radius:10px; font-weight:900; font-size:16px">Pay with Binance Pay</button>
    </div>
  </div>
</div>

<script>
// 50 PRODUITS AUTO
const names = ["iPhone 15 Pro Max", "Samsung S24 Ultra", "AirPods Pro 2", "MacBook Pro M3", "Apple Watch 9", "Nike Air Max 270", "Adidas Ultraboost", "Gaming Headset RGB", "PS5 Controller", "Xbox Controller", "4K Smart TV 55", "Bluetooth Speaker", "DSLR Camera Canon", "Drone DJI Mini 3", "Gaming Chair", "Mechanical Keyboard", "Gaming Mouse", "Power Bank 20000", "Smartwatch Fitness", "Perfume Dior", "Sunglasses Rayban", "Leather Jacket", "Running Shoes", "Backpack Laptop", "Coffee Maker", "Air Fryer", "Robot Vacuum", "LED TV 43", "Soundbar", "Ring Light", "Ring Necklace Gold", "Watch Fossil", "Handbag Gucci", "Wallet Leather", "Sneakers Jordan", "Hoodie Nike", "Jeans Levi's", "T-shirt Cotton", "Cap Supreme", "Socks Pack 5", "Laptop Stand", "USB-C Hub", "Webcam 4K", "Microphone Mic", "Desk Lamp LED", "Yoga Mat", "Dumbbell 10kg", "Protein Powder", "Vitamin Pack", "Massage Gun"];
const descs = ["Premium quality with 1 year warranty. Fast delivery and original product", "Latest model 2026. High performance and durable design", "Best seller product. Free shipping and 30 day returns", "Brand new sealed box. 100% authentic with buyer protection", "Top rated item. Ships from local warehouse. 24h processing"];
const addresses = ["VENDO Warehouse, Paris, France", "VENDO Store, New York, USA", "VENDO Hub, Douala, Cameroun", "VENDO Center, Lyon, France", "VENDO Depot, Los Angeles, USA"];
const images = ["https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=500", "https://images.unsplash.com/photo-1555529669-e69e7aa0ba9d?w=500", "https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=500", "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500", "https://images.unsplash.com/photo-1599669454699-248893623440?w=500", "https://images.unsplash.com/photo-1579586337278-3befd40fd17a?w=500", "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=500", "https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=500"];
const countries = ['FR', 'US', 'CM'];

const products = Array.from({length: 50}, (_, i) => {
  const basePrice = Math.floor(Math.random() * 1500) + 50;
  const country = countries[Math.floor(Math.random() * 3)];
  return {id: i + 1, nom: names[i] + " " + ["Black", "White", "Pro", "Max", "2026"][Math.floor(Math.random()*5)], nom_en: names[i] + " " + ["Black", "White", "Pro", "Max", "2026"][Math.floor(Math.random()*5)], prix: basePrice, prix_plus_5: basePrice + 5, desc: descs[Math.floor(Math.random()*descs.length)], address: addresses[Math.floor(Math.random()*addresses.length)], img: images[Math.floor(Math.random()*images.length)], pays: country}
});

const translations = {FR: { currency: '€' }, US: { currency: '$' }, CM: { currency: 'XAF' }};

let country = 'FR';
let slideIndex = 0;
let cart = [];
let checkoutProduct = null;

// SLIDER
setInterval(()=>{document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));slideIndex = (slideIndex + 1) % 3;document.querySelectorAll('.slide')[slideIndex].classList.add('active');document.querySelectorAll('.dot')[slideIndex].classList.add('active');}, 3000);

// TIMER
setInterval(()=>{const t = document.getElementById('timer');if(!t) return;let [h,m,s] = t.innerText.split(':').map(Number);s--; if(s<0){s=59;m--} if(m<0){m=59;h--} if(h<0)h=23;t.innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`},1000)

// CART
function toggleCart(){document.getElementById('cartSidebar').classList.toggle('active');document.getElementById('cartOverlay').classList.toggle('active');}
function addToCart(id){const product = products.find(p=>p.id===id);cart.push(product);document.querySelector('.cart-count').innerText = cart.length;document.getElementById('cartItems').innerHTML = cart.map(p=>`<div style="display:flex; gap:10px; margin-bottom:15px"><img src="${p.img}" style="width:60px; height:60px; border-radius:8px"><div><div style="font-size:12px">${p.nom}</div><div style="color:#ffc107; font-weight:900">${p.prix}${translations[country].currency}</div></div></div>`).join('');}

// NOTIFS
function openNotifications(){document.getElementById('notifPanel').classList.add('active');document.getElementById('cartOverlay').classList.add('active');loadNewProducts();document.getElementById('notifCount').style.display = 'none';}
function closeNotifications(){document.getElementById('notifPanel').classList.remove('active');document.getElementById('cartOverlay').classList.remove('active');}
function loadNewProducts(){const t = translations[country];const filtered = products.filter(p=>p.pays===country).slice(-5).reverse();document.getElementById('notifList').innerHTML = `<div style="color:#aaa; font-size:12px; margin-bottom:15px">${filtered.length} New Arrivals Today</div>${filtered.map(p=>`<div class="notif-item" onclick="openProduct(${p.id}); closeNotifications()"><img src="${p.img}" style="width:50px; height:50px; border-radius:8px; object-fit:cover"><div><b>Just Added</b><br>${country==='US'?p.nom_en:p.nom}<div style="color:#ffc107; font-weight:900">${p.prix}${t.currency}</div></div></div>`).join('')}`;}

// PRODUCT
function openProduct(id){const p = products.find(x=>x.id===id);const t = translations[country];const oldPrice = (p.prix * 1.6).toFixed(2);const today = new Date();const d1 = new Date(today); d1.setDate(today.getDate() + 5);const d2 = new Date(today); d2.setDate(today.getDate() + 9);const dateStr = `${d1.getDate()}-${d2.getDate()} ${d1.toLocaleString('en',{month:'short'})}`;document.getElementById('productDetail').innerHTML = `<img src="${p.img}" class="product-detail-img"><div class="product-detail-body"><div class="product-detail-title">${country==='US'?p.nom_en:p.nom}</div><div style="color:#ffc107">★4.8 342 sold</div><div class="product-detail-price">${p.prix}${t.currency}</div><div style="text-decoration:line-through; color:#666; font-size:12px">${oldPrice}${t.currency}</div><div class="info-box"><div class="info-row"><span>📍 Store Address</span></div><div style="font-size:12px; color:#aaa">${p.address}</div></div><div class="info-box"><div class="info-row"><span>🚚 Shipping</span><span style="color:#00a3df">Free Shipping</span></div><div class="info-row"><span>📦 Delivery</span><span class="delivery-date">${dateStr}</span></div><div class="info-row"><span>📍 From</span><span>${p.pays==='FR'?'France':p.pays==='US'?'USA':'Cameroun'}</span></div></div><div class="info-box" style="border:1px solid #86b817"><div class="info-row"><span>✅ Product Status</span><span style="color:#86b817; font-weight:900">Original - In Stock</span></div></div><p style="color:#aaa; font-size:13px; margin-top:15px"><b>Description:</b><br>${p.desc}</p></div><div class="btn-group"><button class="btn-add-cart" onclick="addToCart(${p.id}); closeProduct()">Add to Cart</button><button class="btn-buy-now" onclick="openCheckout(${p.id})">Buy Now</button></div>`;document.getElementById('productModal').classList.add('active');document.body.style.overflow = 'hidden';}
function closeProduct(){document.getElementById('productModal').classList.remove('active');document.body.style.overflow = 'auto';}

// CHECKOUT
function openCheckout(id){checkoutProduct = products.find(x=>x.id===id);const t = translations[country];document.getElementById('checkoutSummary').innerHTML = `<b>Order Summary</b><br>${country==='US'?checkoutProduct.nom_en:checkoutProduct.nom}<br>Price: ${checkoutProduct.prix}${t.currency}<br>Binance Fee: 5${t.currency}<br><b style="color:#ffc107">Total: ${checkoutProduct.prix_plus_5}${t.currency}</b>`;closeProduct();document.getElementById('checkoutModal').classList.add('active');}
function closeCheckout(){document.getElementById('checkoutModal').classList.remove('active');document.body.style.overflow = 'auto';}
function payWithBinance(){const name = document.getElementById('shipName').value;const phone = document.getElementById('shipPhone').value;const address = document.getElementById('shipAddress').value;if(!name ||!phone ||!address){alert('Please fill all fields');return;}const amount = checkoutProduct.prix_plus_5;const binancePayUrl = `https://pay.binance.com/en/checkout?amount=${amount}&currency=${translations[country].currency}&orderId=${checkoutProduct.id}&name=${name}`;alert(`Order placed!\nName: ${name}\nPhone: ${phone}\nRedirecting to Binance Pay...`);window.open(binancePayUrl, '_blank');closeCheckout();}

// COUNTRY
function setCountry(c, btn){country = c;document.querySelectorAll('.country-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');load();}

// LOAD
function load(){const t = translations[country];const filtered = products.filter(p=>p.pays===country);document.getElementById('flashGrid').innerHTML = filtered.slice(0,3).map(p=>{const oldPrice = (p.prix * 1.5).toFixed(2);return `<div class="flash-item"><img src="${p.img}"><div class="flash-price">${p.prix}${t.currency}</div><div class="old-price">${oldPrice}${t.currency}</div></div>`;}).join('');document.getElementById('productsGrid').innerHTML = filtered.map((p,i)=>{const isNew = i >= filtered.length - 5;return `<div class="card" onclick="openProduct(${p.id})"><div style="position:relative"><img src="${p.img}"><span class="badge-selling">SELLING</span>${isNew? '<span class="badge-new">NEW</span>' : ''}</div><div class="card-body"><div class="title">${country==='US'?p.nom_en:p.nom}</div><div class="desc">${p.desc}</div><div class="price">${p.prix}${t.currency}</div><div class="meta">★4.8 (342 sold)</div><div class="shipping-free">✓ Free Shipping</div><button class="btn-add" onclick="event.stopPropagation(); addToCart(${p.id})">Add to Cart</button></div></div>`}).join('');}

load();
</script>
</body>
</html>
